<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Caça ao Tesouro AR</title>

    <!-- Leaflet CSS (used by react-leaflet) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!--
      A-Frame ecosystem MUST load before React.
      These register custom HTML elements (<a-scene>, <a-marker>, etc.)
      that React will leave alone.
    -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>
  </head>

  <body style="margin:0; overflow:hidden; background:#000;">

    <!--
      AR wrapper — lives outside React's #root so React's reconciler
      never touches it. React controls it only via style.display.

      The <a-scene> is NOT here yet — it is injected lazily by useAR.ts
      the first time the user taps "Scan", so the camera permission
      prompt only appears when the user actually wants to scan.
    -->
    <div
      id="ar-wrapper"
      style="
        display: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        width: 100%;
        height: 100%;
      "
    ></div>

    <!-- React mounts here, always on top via z-index -->
    <div id="root" style="position: relative; z-index: 100;"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
