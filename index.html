<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caça ao Tesouro AR</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        /* UI Overlay */
        #ui-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to AR by default */
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }

        .banner {
            background: rgba(0,0,0,0.7);
            padding: 15px 25px;
            border-radius: 0 0 15px 15px;
            pointer-events: auto;
        }

        #quiz-card {
            position: absolute;
            bottom: 30px;
            background: rgba(15, 15, 25, 0.9);
            border: 2px solid #f0a500;
            border-radius: 20px;
            padding: 20px;
            width: 80%;
            max-width: 400px;
            display: none; /* Hidden until marker found */
            pointer-events: auto;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
        }

        button {
            background: #f0a500;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="ui-layer">
        <div class="banner">
            <h2 style="margin:0">🗺 Localize o Marcador</h2>
        </div>

        <div id="quiz-card">
            <p id="treasure-title" style="color:#f0a500; font-weight:bold; margin:0">TESOURO ENCONTRADO!</p>
            <p id="question-text">Carregando pergunta...</p>
            <input type="text" id="answer-input" placeholder="Sua resposta...">
            <button onclick="checkAnswer()">Enviar Resposta</button>
        </div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <a-asset-item id="chest" src="models/Chest.glb"></a-asset-item>
        </a-assets>

        <a-marker id="hiro-marker" preset="hiro">
            <a-entity 
                gltf-model="#chest" 
                scale="0.5 0.5 0.5" 
                position="0 0.5 0"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script src="script.js"></script>
</body>
</html>
